name: PR Preview Deploy
on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install and test
        run: |
          yarn install:ci
          yarn audit
          yarn lint
          yarn test

  deploy-dev:
    runs-on: ubuntu-latest
    needs: typescript
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BUILD_ENV: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Build lambda code
        run: |
          yarn install:ci
          yarn build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: make init

      - name: Terraform Validate
        working-directory: ./terraform
        run: make validate ARGS="-no-color"

      - name: Terraform Plan
        working-directory: ./terraform
        run: make plan ARGS="-no-color"

      - name: Terraform Apply (Dev)
        working-directory: ./terraform
        run: make apply ARGS="-auto-approve"
